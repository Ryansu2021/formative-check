<h1>課堂形成性檢核</h1>
<p>第一場整卷作答 → 討論 → 第二場平行題，教師儀表板即時顯示迷思分布。兩條路線是同一套系統，差別在題庫從哪裡來。</p>
<div class="cards">
<a class="c" href="route-a.html"><span class="t" style="background:var(--dai)">路線 A</span><b>Claude 備課端產題庫</b><span>依三版本教科書知識卡產生迷思表與關鍵題，匯入後使用。內建七上 2-1 質因數分解 9 組平行題。</span></a>
<a class="c" href="route-b.html"><span class="t" style="background:var(--huang)">路線 B</span><b>系統內建 AI 生題</b><span>教師端輸入單元，用自己的 Gemini key 生題，程式自動驗算、老師審題後使用。</span></a>
</div>
<p style="font-size:15px">學生：掃老師投影的 QR Code，或開路線網址 → 學生作答 → 輸入代碼與座號。</p>
