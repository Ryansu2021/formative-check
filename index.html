<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國中數學課堂形成性評量入口</title>
<style>

:root{
  --bg:#f3f8fb;--card:#fff;--ink:#18324a;--ink2:#4f6679;--ink3:#8aa0b2;--line:#e2ecf3;
  --k:#2f7fd8;--kbg:#e8f2fd;   /* 康軒 */
  --s:#12a37f;--sbg:#e3f6ef;   /* 南一 */
  --c:#e0901c;--cbg:#fff3df;   /* 翰林 */
  --v:#7a6ad8;--vbg:#efecfc;
  --g7:#0f9fa6;--g7bg:#dff5f6;   /* 七年級 */
  --g8:#ee6a58;--g8bg:#fde8e4;   /* 八年級 */
  --g9:#7a6ad8;--g9bg:#ece9fb;   /* 九年級 */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 85% -10%,#dff1ff 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#e0f7ee 0,transparent 55%),var(--bg);background-attachment:fixed;
 color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65;font-size:16px;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--v);outline-offset:2px;border-radius:8px}
.wrap{max-width:1280px;margin:auto;padding:0 24px}

/* ---------- 頂部列 ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(243,248,251,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
.brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--g7),var(--v));display:grid;place-items:center;color:#fff;font-style:normal;font-size:19px;font-weight:800}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);font-weight:600;flex-wrap:wrap}
.crumb a{padding:2px 10px;border-radius:999px}
.crumb a:hover{background:#e6eff6}
.crumb .sep{color:var(--ink3)}
.crumb b{color:var(--ink)}
.search{margin-left:auto;position:relative;flex:0 1 340px;min-width:200px}
.search input{width:100%;font:inherit;font-size:15.5px;padding:9px 16px 9px 40px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.search input:focus{border-color:var(--v);outline:none;box-shadow:0 0 0 4px rgba(122,106,216,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round}

h1{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:.01em}
.tomorrow{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:999px;background:linear-gradient(135deg,#e2584a,#7a6ad8);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 4px 12px rgba(122,106,216,.25)}
.tomorrow:hover{filter:brightness(1.07)}
.tomorrow + .search{margin-left:0}
/* ---------- 首頁：單一畫面，隨視窗縮放，不出現捲軸 ---------- */
body.fit{height:100vh;height:100dvh;overflow:hidden}
body.fit .wrap.page{max-width:1680px;height:calc(100vh - var(--topH,60px));height:calc(100dvh - var(--topH,60px));display:flex;flex-direction:column}
body.fit main{flex:1;min-height:0}
body.fit footer{display:none}
.home{height:100%;display:flex;flex-direction:column;gap:.9em;padding:1.1em 0 1.3em;font-size:var(--u,16px);min-height:0}
.hero{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.6em 2em}
.kick{font-size:.9em;color:var(--ink3);font-weight:700;letter-spacing:.08em}
.hero h1{font-size:2.4em;line-height:1.2;font-weight:800;letter-spacing:.01em;margin-top:.05em}
.lead{color:var(--ink2);font-size:1.02em;margin-top:.3em;max-width:30em;line-height:1.55}
.stats{display:flex;gap:.7em;flex-wrap:wrap}
.stat{background:var(--card);border-radius:1em;padding:.5em 1.1em;box-shadow:0 4px 14px rgba(24,50,74,.06);display:flex;align-items:baseline;gap:.5em}
.stat b{font-size:1.8em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.9em;color:var(--ink2);font-weight:600}
.legend{flex:none;display:flex;gap:.4em 1em;flex-wrap:wrap;align-items:center;font-size:.88em;color:var(--ink2);font-weight:600}
.vchip{display:inline-flex;align-items:center;gap:.4em;padding:.05em .75em;border-radius:999px;font-size:.85em;font-weight:800;color:var(--t);background:var(--tb)}
.vchip i{width:8px;height:8px;border-radius:50%;background:var(--t)}
.legend .vchip{font-size:1em}
.kx{--t:var(--k);--tb:var(--kbg)}.ny{--t:var(--s);--tb:var(--sbg)}.hl{--t:var(--c);--tb:var(--cbg)}

/* ---------- 年級圖卡 ---------- */
.grades{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4em}
.g7{--gc:var(--g7);--gb:var(--g7bg)}.g8{--gc:var(--g8);--gb:var(--g8bg)}.g9{--gc:var(--g9);--gb:var(--g9bg)}
.gcard{position:relative;overflow:hidden;min-height:0;background:var(--card);border-radius:1.6em;padding:1.3em 1.5em 1.2em;box-shadow:0 8px 26px rgba(24,50,74,.08);border-top:.5em solid var(--gc);display:flex;flex-direction:column;gap:.7em;transition:transform .18s,box-shadow .18s;cursor:pointer}
.gcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(24,50,74,.13)}
.gcard .mark{position:absolute;right:.15em;top:-.1em;font-size:6.5em;font-weight:800;line-height:1;color:var(--gb);pointer-events:none;user-select:none}
.gcard h2{position:relative;font-size:2em;font-weight:800;line-height:1.2}
.gcard h2 small{display:block;font-size:.42em;color:var(--ink3);font-weight:700;letter-spacing:.08em}
.gcard ul{position:relative;list-style:none;display:flex;flex-direction:column;gap:.3em;font-size:.98em;color:var(--ink2);flex:1;min-height:0;justify-content:center;line-height:1.5}
.gcard li{display:flex;gap:.55em;align-items:baseline}
.gcard li b{flex:none;min-width:2.8em;font-size:.82em;color:var(--gc);background:var(--gb);border-radius:999px;padding:0 .5em;text-align:center;font-weight:800}
.gcard li.none{color:var(--ink3)}
.bar{position:relative;flex:none;height:.65em;border-radius:99px;background:var(--gb);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gc)}
.gmeta{position:relative;flex:none;display:flex;justify-content:space-between;font-size:.95em;font-weight:700;color:var(--ink2)}
.gmeta b{color:var(--ink);font-variant-numeric:tabular-nums}
.sems{position:relative;flex:none;display:flex;gap:.7em}
.sems a{flex:1;text-align:center;padding:.5em .6em;border-radius:.9em;font-weight:800;font-size:1.02em;line-height:1.3;background:var(--gb);color:var(--gc);transition:background .15s,color .15s}
.sems a:hover{background:var(--gc);color:#fff}
.sems a small{display:block;font-size:.8em;font-weight:600;opacity:.85}
@media(max-width:820px){
  .grades{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:.8em}
  .lead{display:none}
  .gcard{padding:.8em 1em .8em;gap:.4em}
  .gcard h2{font-size:1.6em}.gcard .mark{font-size:5em}
  .hero h1{font-size:1.9em}
}
@media(max-height:560px){.lead{display:none}}

/* ---------- 年級頁：章節並排成欄，單一畫面、隨視窗縮放 ---------- */
.gpage{font-size:var(--u,16px);padding:1.1em 0 1.4em;display:flex;flex-direction:column;gap:.8em;min-height:0}
body.fit .gpage{height:100%;padding:.9em 0 1.1em}
.ghead{flex:none;display:flex;align-items:center;gap:.6em 1.6em;flex-wrap:wrap}
.ghead .big{font-size:3.4em;font-weight:800;line-height:1;color:var(--gc)}
.ghead h1{font-size:1.9em;margin:0;line-height:1.2}
.ghead .kick{font-size:.88em}
.ctrl{margin-left:auto;display:flex;align-items:center;gap:.6em 1.2em;flex-wrap:wrap}
.seg{display:inline-flex;background:#e6eff6;border-radius:999px;padding:.3em;gap:.25em}
.seg a{padding:.4em 1.4em;border-radius:999px;font-weight:800;font-size:1.05em;color:var(--ink2)}
.seg a.on{background:var(--gc);color:#fff;box-shadow:0 3px 10px rgba(24,50,74,.18)}
.seg a:not(.on):hover{background:#fff}
.filt{display:inline-flex;gap:.4em;flex-wrap:wrap}
.filt button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.15em .9em;font-weight:700;font-size:.92em;color:var(--ink2);cursor:pointer}
.filt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chk{display:inline-flex;gap:.45em;align-items:center;font-size:.92em;color:var(--ink2);font-weight:600;cursor:pointer}
.chk input{width:1.1em;height:1.1em;accent-color:var(--v);cursor:pointer}

.chaps{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1em;align-items:stretch}
.chap{background:var(--card);border-radius:1.4em;box-shadow:0 6px 20px rgba(24,50,74,.06);overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.chap-h{flex:none;display:flex;align-items:center;gap:.6em;padding:.7em 1em;background:linear-gradient(90deg,var(--gb),#fff 85%);border-left:.4em solid var(--gc)}
.chap .no{display:flex;align-items:baseline;gap:.15em;font-size:.9em;font-weight:800;color:var(--gc);white-space:nowrap}
.chap .no b{font-size:2em;line-height:1}
.chap h3{font-size:1.3em;font-weight:800;line-height:1.3;flex:1;min-width:0}
.chap .prog{font-size:.85em;font-weight:800;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cbody{flex:1;min-height:0;padding:.8em .8em .9em;display:flex;flex-direction:column;gap:.7em;overflow:hidden}
.chap.wide{grid-column:span 2}.chap.wide .cbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:min-content;align-content:start}
/* 一頁放不下改捲動時：一章一列，小節卡片橫排 */
body.roll .chaps{grid-template-columns:minmax(0,1fr)}
body.roll .chap.wide{grid-column:auto}
body.roll .cbody,body.roll .chap.wide .cbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));grid-auto-rows:min-content;align-content:start;overflow:visible}
.fsz + .search{flex:0 1 240px;min-width:160px}
.fsz{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;flex:none}
.fsz button{border:0;background:none;font:inherit;font-weight:800;color:var(--ink2);padding:5px 11px;cursor:pointer;line-height:1.2}
.fsz button+button{border-left:2px solid var(--line)}
.fsz button:hover{background:#eef5fa}.fsz button.on{background:var(--ink);color:#fff}
.lks{display:flex;flex-wrap:wrap;gap:.2em .9em;font-size:.86em;font-weight:700}
.lks a{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}.lks a:hover{color:var(--v)}
.sec .st{cursor:help}
.cextra{display:flex;gap:.5em;flex-wrap:wrap}

.sec{flex:none;background:#fff;border:2px solid var(--line);border-radius:1.1em;padding:.75em .9em .8em;display:flex;flex-direction:column;gap:.5em;position:relative;transition:border-color .15s,box-shadow .15s;min-width:0}
.sec.ready{border-color:#cfe0ee;box-shadow:0 4px 14px rgba(24,50,74,.06)}
.sec.ready:hover{border-color:var(--gc);box-shadow:0 8px 22px rgba(24,50,74,.12)}
.sec.wait{background:#fafcfd;border-style:dashed;border-color:#d3e0ea}
.sec{container-type:inline-size}
.sh{display:flex;align-items:flex-start;gap:.6em}
@container (max-width:310px){.sh{flex-wrap:wrap;row-gap:.25em}.sh .st{order:3;flex:1 1 100%}.sh .badge{margin-left:auto}}
.sn{flex:none;font-weight:800;font-size:.9em;padding:.1em .7em;border-radius:999px;background:var(--gc);color:#fff;margin-top:.15em;font-variant-numeric:tabular-nums}
.wait .sn{background:#c5d3de}
.st{font-size:1.15em;font-weight:800;line-height:1.35;flex:1;min-width:0}
.wait .st{color:var(--ink2)}
.badge{flex:none;font-size:.84em;font-weight:800;border-radius:999px;padding:.05em .7em;margin-top:.2em}
.badge.ok{background:#e1f6ec;color:#0c7d5c}
.badge.no{background:#eef2f6;color:#7b8fa0}
.names{display:flex;flex-wrap:wrap;gap:.3em .4em}
.names .vchip{font-weight:700;font-size:.88em}
.names .same{font-size:.82em;color:var(--ink3);font-weight:600}
.note{font-size:.9em;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:.5em;margin-top:auto}
.pb{display:inline-flex;align-items:center;gap:.45em;padding:.4em .9em;border-radius:.8em;font-weight:800;font-size:.95em;color:#fff;background:var(--pt);transition:transform .12s,filter .12s;cursor:pointer;border:0}
.pb:hover{transform:translateY(-2px);filter:brightness(1.07)}
.pb svg{width:1em;height:1em;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pb.soon{background:transparent;color:var(--ink3);border:2px dashed #cbd8e2;cursor:default;padding:.25em .8em;font-weight:700;font-size:.88em}
.pb.soon:hover{transform:none;filter:none}
.pb.mini{padding:.2em .8em;font-size:.9em;border-radius:999px}

.empty{background:var(--card);border-radius:24px;padding:40px 30px;margin:24px 0;text-align:center;border:3px dashed #cbd8e2;color:var(--ink2)}
.empty h3{font-size:22px;color:var(--ink);margin-bottom:6px}
.empty p{max-width:640px;margin:6px auto 0;font-size:16px}
.empty code{background:#eef5fa;border-radius:6px;padding:1px 7px;font-size:14px}
.gpage .empty{flex:1;margin:0;display:flex;flex-direction:column;justify-content:center;font-size:1em}
.gpage .empty h3{font-size:1.4em}.gpage .empty p{font-size:1em}
@media(max-width:719px){
  .chaps{grid-template-columns:minmax(0,1fr)}
  .ctrl{margin-left:0}
  .ghead .big{font-size:2.8em}
  .cbody{overflow:visible}
  .chap.wide{grid-column:auto}.chap.wide .cbody{display:flex}
}

/* ---------- 搜尋結果 ---------- */
.rh{padding:26px 0 4px}
.rh h1{font-size:28px}
.rcrumb{font-size:13.5px;font-weight:800;color:var(--gc);letter-spacing:.04em}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin:16px 0 40px}

footer{margin:34px 0 40px;color:var(--ink3);font-size:13.5px;line-height:1.8}
footer b{color:var(--ink2)}
@media(max-width:700px){
  .wrap{padding:0 16px}
  h1{font-size:28px}
  .search{flex:1 1 100%;margin-left:0;order:3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- 評量入口：沿用備課入口版型，以下為增補 ---------- */
.brand i{background:linear-gradient(135deg,#e2584a,var(--v))}
.tomorrow.alt{background:linear-gradient(135deg,var(--g7),var(--k))}
.tomorrow.alt + .tomorrow{margin-left:0}
.badge.mk{background:#fff3df;color:#a8650a}
.sec.mk{background:#fffdf8;border-style:dashed;border-color:#f3d6a6}
.mk .sn{background:#e8b65a}
.fa-info{display:flex;flex-wrap:wrap;gap:.3em .5em;font-size:.92em}
.fa-info b{background:var(--vbg);color:var(--v);border-radius:999px;padding:0 .7em;font-weight:800}
.fa-mis{font-size:.86em;color:var(--ink2);line-height:1.5}
.fa-mis i{font-style:normal;color:#c4473c;font-weight:700}
.flow{flex:none;display:flex;flex-wrap:wrap;gap:.35em .5em;align-items:center;font-size:.86em;font-weight:700;color:var(--ink2)}
.flow span{background:#fff;border-radius:999px;padding:.15em .8em;box-shadow:0 2px 8px rgba(24,50,74,.06)}
.flow em{font-style:normal;color:var(--ink3)}
.loading{color:var(--ink3);font-size:.85em;font-weight:600}
</style>
</head>

        { no:2, title:'分數的運算', sections:[

          { no:'2-2', title:'最大公因數與最小公倍數', names:{kx:'最大公因數與最小公倍數', ny:'公因數與公倍數', hl:'最大公因數與最小公倍數'}},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NUM = {7:'七',8:'八',9:'九'};
const LOCAL = location.protocol === 'file:';
const IC = { open:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>' };
const BANK = {};          // 單元 → 題庫摘要（線上檢查得到）
let CHECKED = false;

const semShort = (g, sm) => NUM[g.id] + (sm.id === 'up' ? '上' : '下');
const unitOf = (g, sm, sec) => semShort(g, sm) + sec.no;
function allSections(){
  const rows = [];
  FA.grades.forEach(g => g.semesters.forEach(sm => sm.chapters.forEach(ch => ch.sections.forEach(sec =>
    rows.push({ g, sm, ch, sec, u: unitOf(g, sm, sec) })))));
  return rows;
}
const stateOf = u => BANK[u] ? 'ready' : FA.making.includes(u) ? 'mk' : 'wait';
function count(filterFn){
  const rows = allSections().filter(filterFn || (() => true));
  return { total: rows.length, ready: rows.filter(r => BANK[r.u]).length, mk: rows.filter(r => stateOf(r.u) === 'mk').length };
}

/* ---- 線上題庫檢查 ---- */
function summarize(b){
  const pairs = new Set((b.items || []).map(it => it.pair || it.id)).size;
  const use = {}; (b.items || []).forEach(it => it.options.forEach(o => { if (o.mis) use[o.mis] = (use[o.mis] || 0) + 1; }));
  const mm = {}; (b.misconceptions || []).forEach(m => mm[m.code] = m.name);
  const top = Object.entries(use).sort((a, c) => c[1] - a[1]).slice(0, 3).map(([c]) => mm[c]).filter(Boolean);
  return { pairs, items: (b.items || []).length, mis: (b.misconceptions || []).length, top };
}
async function checkBanks(){
  const rows = allSections();
  await Promise.all(rows.map(async r => {
    try { const res = await fetch(FA.online + 'banks/' + encodeURIComponent(r.u) + '.json', { cache: 'no-cache' });
      if (res.ok) BANK[r.u] = summarize(await res.json()); } catch (e) {}
  }));
  CHECKED = true; route();
}

/* ---- 自動縮放（同備課入口）：盡量一個畫面；字不小於下限，放不下就改成往下捲動 ---- */
const FS_STEPS = [0.9, 1, 1.15, 1.3];
let FSI = 1; try { const t = localStorage.getItem('portalFS'); const v = Number(t); if (t !== null && t !== '' && v >= 0 && v < FS_STEPS.length) FSI = v; } catch (e) {}
function setFS(d){
  FSI = d === 0 ? 1 : Math.max(0, Math.min(FS_STEPS.length - 1, FSI + d));
  try { localStorage.setItem('portalFS', String(FSI)); } catch (e) {}
  markFS(); applyFit();
}
function markFS(){ document.querySelectorAll('.fsz button').forEach(b => b.classList.toggle('on', Number(b.dataset.fs) === 0 && FSI === 1)); }
document.querySelectorAll('.fsz button').forEach(b => b.onclick = () => setFS(Number(b.dataset.fs)));
markFS();
function applyFit(){
  const k = FS_STEPS[FSI];
  const home = document.querySelector('.home'), gp = document.querySelector('.gpage');
  const on = !!home || (!!gp && innerWidth >= 720);
  document.body.classList.toggle('fit', on);
  document.body.classList.remove('roll');
  const top = document.querySelector('.top');
  if (top) document.documentElement.style.setProperty('--topH', top.offsetHeight + 'px');
  const root = home || gp; if (!root) return;
  if (!on){ root.style.setProperty('--u', (16 * k) + 'px'); return; }
  const want = (home ? Math.max(10, Math.min(20, innerWidth / 62, innerHeight / 40))
                     : Math.max(11, Math.min(22, innerWidth / 52, innerHeight / 32))) * k;
  const floor = (home ? 12 : 16.5) * k;
  let u = want; root.style.setProperty('--u', u + 'px');
  const bad = el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
  const over = () => bad(root) || [...root.querySelectorAll('.gcard,.cbody,.sec')].some(bad);
  let n = 0; while (over() && u > floor && n++ < 80){ u = Math.max(floor, u - .5); root.style.setProperty('--u', u + 'px'); }
  if (over()){ document.body.classList.remove('fit'); document.body.classList.add('roll'); root.style.setProperty('--u', Math.max(floor, Math.min(want, 18 * k)) + 'px'); }
}
window.addEventListener('resize', applyFit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyFit);

function route(){
  const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/');
  const app = $('#app'); let crumb = []; const q = $('#q').value.trim();
  if (q){ app.innerHTML = viewSearch(q); crumb = [{t:'首頁',h:'#/'},{t:'搜尋'}]; }
  else { const g = a && a.startsWith('g') ? FA.grades.find(x => 'g'+x.id === a) : null;
    if (g){ const sm = g.semesters.find(s => s.id === b) || g.semesters[0]; app.innerHTML = viewGrade(g, sm);
      crumb = [{t:'首頁',h:'#/'},{t:g.name,h:'#/g'+g.id+'/'+g.semesters[0].id},{t:sm.name}]; document.title = `${g.name}${sm.name}｜${FA.title}`; }
    else { app.innerHTML = viewHome(); document.title = FA.title + '入口'; } }
  $('#crumb').innerHTML = crumbHtml(crumb); bind(); applyFit();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(el => { el.onclick = () => { location.hash = el.dataset.go; };
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = el.dataset.go; } }; });
  document.querySelectorAll('.filt button').forEach(b => b.onclick = () => { FILTER = b.dataset.f; route(); });
}
$('#brand').onclick = () => { $('#q').value = ''; location.hash = '#/'; route(); window.scrollTo(0,0); };
$('#brand').onkeydown = e => { if (e.key === 'Enter') $('#brand').click(); };
$('#q').addEventListener('input', route);
window.addEventListener('hashchange', () => { if ($('#q').value) $('#q').value = ''; route(); window.scrollTo(0,0); });
if (!LOCAL) $('#toPrep').remove();
$('#foot').innerHTML = `<b>${esc(FA.title)}</b>　資料更新：${esc(FA.updated)}　·　蘇恭弘。數學王子。台南市忠孝國中製作<br>
  題庫狀態即時讀取線上 banks/ 資料夾；「題組與迷思表」連到本機的三版本比較網頁，只在這台電腦上顯示。`;
route(); checkBanks();
</script>
