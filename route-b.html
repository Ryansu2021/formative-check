<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>課堂形成性評量・路線B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f3ead7; --paper2:#eadfc6; --card:#fbf6ea; --ink:#2a2420; --ink2:#5d5248; --ink3:#8c7f70;
  --line:#d8c9a8; --zhu:#b5432f; --zhu-l:#f3d9d0; --qing:#4f8a78; --qing-l:#d6e8e0; --huang:#b98a1e; --huang-l:#f3e6c2;
  --dai:#3c587a; --dai-l:#d9e2ee;
  --oA:#3c587a; --oB:#b98a1e; --oC:#8b5a3c; --oD:#6d5a8a; --oE:#4a6b4a;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif; --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9ccb0;font-family:var(--sans);color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;
  background:var(--paper);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 40%),radial-gradient(circle at 90% 90%,rgba(181,67,47,.05),transparent 40%);
  box-shadow:0 10px 40px rgba(60,40,20,.25);overflow:hidden;display:flex;flex-direction:column}
header.top{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:2px solid var(--line);background:rgba(251,246,234,.7)}
.brand{font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:2px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .seal{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--zhu);color:#fff;font-size:17px;letter-spacing:0}
.route-tag{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid var(--ink2);color:var(--ink2);font-family:var(--sans);letter-spacing:0}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ink3)}
.dot.on{background:var(--qing)} .dot.warn{background:var(--huang)} .dot.off{background:var(--zhu)}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:26px 32px;display:flex;flex-direction:column;gap:18px}
footer.by{position:absolute;right:18px;bottom:8px;font-size:12px;color:var(--ink3);font-family:var(--serif);pointer-events:none}
h1,h2,h3{font-family:var(--serif);margin:0}
.btn{font-family:var(--sans);font-weight:700;font-size:17px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 20px;border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.zhu{background:var(--zhu);color:#fff;border-color:#7d2a1c;box-shadow:3px 3px 0 #7d2a1c}
.btn.qing{background:var(--qing);color:#fff;border-color:#2f5b4d;box-shadow:3px 3px 0 #2f5b4d}
.btn.dai{background:var(--dai);color:#fff;border-color:#243a55;box-shadow:3px 3px 0 #243a55}
.btn.ghost{box-shadow:none;border-color:var(--line);background:transparent}
.btn.sm{font-size:14px;padding:6px 12px;border-radius:8px;box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-size:22px;padding:16px 28px;border-radius:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px}
.muted{color:var(--ink3)} .small{font-size:14px}
input[type=text],input[type=number],input[type=password],textarea,select{font-family:var(--sans);font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fffdf7;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--dai)}
label.fl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px;color:var(--ink2)}
.row{display:flex;gap:14px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
sup{font-size:.62em;line-height:0;position:relative;top:-.15em;vertical-align:super}
.math{font-family:'Times New Roman',var(--serif);letter-spacing:.5px}

/* ---------- 首頁 ---------- */
#v-home{align-items:center;justify-content:center;gap:30px}
#v-home h1{font-size:58px;letter-spacing:6px}
#v-home .sub{font-size:21px;color:var(--ink2);font-family:var(--serif)}
.home-choice{display:flex;gap:34px;margin-top:10px}
.home-card{width:420px;height:250px;border:2.5px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:6px 6px 0 var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform .1s}
.home-card:hover{transform:translate(-2px,-2px)}
.home-card .ic{font-size:60px} .home-card b{font-family:var(--serif);font-size:32px} .home-card span{color:var(--ink2);font-size:16px}
.home-note{max-width:980px;text-align:center;color:var(--ink2);font-size:16px;line-height:1.7}

/* ---------- 學生 ---------- */
#v-join{align-items:center;justify-content:center}
.join-box{width:620px;display:flex;flex-direction:column;gap:20px;align-items:stretch}
.join-box input{font-size:34px;text-align:center;letter-spacing:6px;padding:14px}
.err{color:var(--zhu);font-weight:700;background:var(--zhu-l);border:1.5px solid var(--zhu);padding:10px 14px;border-radius:10px}
#v-stu{padding:22px 40px}
.stu-head{display:flex;align-items:center;gap:16px}
.stu-head .qno{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--zhu)}
.round-banner{background:var(--huang-l);border:2px solid var(--huang);color:#6b4f10;font-weight:700;padding:10px 16px;border-radius:12px;font-size:19px}
.stem{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;align-items:center;gap:18px;border:2.5px solid var(--line);border-radius:16px;background:var(--card);padding:18px 22px;cursor:pointer;font-size:32px;min-height:96px;transition:all .1s}
.opt:hover{border-color:var(--ink2)}
.opt .k{flex:0 0 52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;font-family:var(--sans)}
.opt.sel{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink);background:#fff}
.opt.was{outline:3px dashed var(--ink3);outline-offset:3px}
.opt.right{border-color:var(--qing);background:var(--qing-l)}
.opt.wrong{border-color:var(--zhu);background:var(--zhu-l)}
.opt.dim{opacity:.45}
.conf{display:flex;gap:14px;align-items:center;font-size:20px;font-weight:700}
.conf button{font-size:20px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--sans);font-weight:700}
.conf button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.stu-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.stu-msg .big{font-family:var(--serif);font-size:46px;font-weight:900}
.fb{font-size:24px;line-height:1.6;padding:16px 20px;border-radius:14px;border:2px solid}
.fb.ok{background:var(--qing-l);border-color:var(--qing)} .fb.no{background:var(--zhu-l);border-color:var(--zhu)}

/* ---------- 教師：題庫 ---------- */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.tab{font-family:var(--serif);font-weight:700;font-size:19px;padding:10px 22px;border:2px solid transparent;border-bottom:none;border-radius:12px 12px 0 0;cursor:pointer;color:var(--ink2);background:transparent;margin-bottom:-2px}
.tab.on{background:var(--card);border-color:var(--line);color:var(--ink)}
.tpane{flex:1;display:flex;gap:20px;min-height:0}
.scroll{overflow:auto;min-height:0}
.scroll::-webkit-scrollbar{width:10px} .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.bank-side{width:360px;flex:0 0 360px;display:flex;flex-direction:column;gap:14px}
.bank-list{display:flex;flex-direction:column;gap:8px}
.bank-li{border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--card)}
.bank-li.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.bank-li b{font-family:var(--serif);font-size:16px;display:block}
.bank-li .meta{font-size:13px;color:var(--ink3);margin-top:3px}
.rtag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;margin-right:6px;vertical-align:1px}
.rtag.A{background:var(--dai)} .rtag.B{background:var(--huang)}
.items{flex:1;display:flex;flex-direction:column;gap:10px;padding-right:6px}
.item{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px 16px}
.item-h{display:flex;gap:12px;align-items:center}
.item-h input[type=checkbox]{width:22px;height:22px;accent-color:var(--zhu)}
.item-h .st{font-family:var(--serif);font-size:18px;font-weight:700;flex:1}
.badge{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.pass{background:var(--qing-l);color:#245446;border:1px solid var(--qing)}
.badge.fail{background:var(--zhu-l);color:#7d2a1c;border:1px solid var(--zhu)}
.badge.manual{background:var(--huang-l);color:#6b4f10;border:1px solid var(--huang)}
.badge.bl{background:var(--dai-l);color:var(--dai);border:1px solid var(--dai)}
.item-o{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:8px 0 0 34px;font-size:15px}
.item-o div{display:flex;gap:8px;align-items:baseline}
.item-o .ok{color:#245446;font-weight:700}
.mis-code{font-size:12px;font-weight:700;color:var(--zhu);border:1px solid var(--zhu);border-radius:5px;padding:0 5px}
.diag{font-size:12px;color:var(--ink3)}
.vmsg{margin:6px 0 0 34px;font-size:13.5px;color:#7d2a1c}
.vmsg.w{color:#6b4f10}
.create-box{display:flex;flex-direction:column;gap:10px}

/* ---------- 教師：即時儀表板 ---------- */
#v-live{padding:18px 26px;gap:14px}
.live-bar{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.code-big{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:6px;color:var(--zhu);background:var(--card);border:2px solid var(--zhu);border-radius:12px;padding:2px 16px;cursor:pointer}
.phase{font-weight:700;font-size:16px;padding:6px 12px;border-radius:10px;background:var(--paper2)}
.phase.open{background:var(--qing);color:#fff} .phase.locked{background:var(--huang);color:#fff} .phase.reveal{background:var(--dai);color:#fff}
.live-grid{flex:1;display:grid;grid-template-columns:1.12fr 1fr;grid-template-rows:auto 1fr;gap:14px;min-height:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative}
.panel h3{font-size:19px;display:flex;align-items:center;gap:10px}
.panel h3 .n{font-family:var(--sans);font-size:14px;color:var(--ink3);font-weight:500}
.live-stem{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.45}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center}
.bar-row .k{height:40px;border-radius:9px;color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center}
.bar-track{position:relative;height:46px;background:var(--paper2);border-radius:9px;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .4s ease;opacity:.3;border-right:6px solid rgba(0,0,0,.25)}
.bar-fill.r2{opacity:.42;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px)}
.bar-txt{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:var(--ink);white-space:nowrap;display:flex;gap:10px;align-items:center}
.bar-row .cnt{font-size:22px;font-weight:900;text-align:right;font-family:var(--serif)}
.bar-row.right .bar-track{outline:3px solid var(--qing);outline-offset:1px}
.bar-ghost{position:absolute;top:0;bottom:0;border-right:3px dashed var(--ink2);transition:left .4s}
.mis-bars{display:flex;flex-direction:column;gap:8px}
.mis-row{display:grid;grid-template-columns:1fr 54px;gap:10px;align-items:center;cursor:pointer}
.mis-row .t{font-size:16px;font-weight:700;margin-bottom:3px}
.mis-row .t .mis-code{margin-right:6px}
.mis-track{height:24px;background:var(--paper2);border-radius:6px;overflow:hidden;position:relative}
.mis-fill{position:absolute;left:0;top:0;bottom:0;background:var(--zhu);transition:width .4s}
.mis-fill.sure{background:#7d2a1c}
.mis-row .c{font-family:var(--serif);font-weight:900;font-size:22px;text-align:right}
.mis-seats{font-size:13px;color:var(--ink2);margin-top:2px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad div{border-radius:10px;padding:8px 12px;border:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.quad div b{font-family:var(--serif);font-size:26px}
.quad .q-ok{background:var(--qing-l)} .quad .q-luck{background:#eef3ef} .quad .q-learn{background:#f7eee6} .quad .q-stuck{background:var(--zhu-l);border-color:var(--zhu);color:#7d2a1c}
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.seat{height:38px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink3);position:relative}
.seat.in{border-style:solid;border-color:var(--ink3);background:#fff;color:var(--ink2)}
.seat.ans{background:var(--ink2);border-color:var(--ink2);color:#fff}
.seat.ok{background:var(--qing);border-color:var(--qing);color:#fff}
.seat.no{background:var(--zhu);border-color:var(--zhu);color:#fff}
.seat.sure::after{content:'';position:absolute;inset:-5px;border:3px solid #7d2a1c;border-radius:11px}
.seat.flash{animation:fl .6s}
@keyframes fl{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.suggest{font-size:15.5px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--huang-l);border:1.5px solid var(--huang);color:#5c430c}
.veil{position:absolute;inset:44px 10px 10px;background:repeating-linear-gradient(135deg,var(--paper2) 0 14px,var(--card) 14px 28px);border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--ink2);font-size:18px;text-align:center}
.trans{display:flex;gap:8px;flex-wrap:wrap}
.trans span{font-size:14px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--paper2)}
.qr-modal{position:absolute;inset:0;background:rgba(42,36,32,.55);display:grid;place-items:center;z-index:50}
.qr-box{background:var(--card);border-radius:22px;padding:30px 44px;display:flex;gap:40px;align-items:center;border:3px solid var(--ink)}
.qr-box .c{font-family:var(--serif);font-weight:900;font-size:110px;letter-spacing:14px;color:var(--zhu);line-height:1}
#qr{background:#fff;padding:12px;border-radius:10px}

/* ---------- 出場摘要 ---------- */
#v-sum{gap:14px}
.sum-grid{flex:1;display:grid;grid-template-columns:1fr 1.15fr;gap:16px;min-height:0}
.stat-row{display:flex;gap:12px}
.stat{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-family:var(--serif);font-size:32px} .stat span{font-size:14px;color:var(--ink3)}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
table.t th{background:var(--paper2);font-weight:700;position:sticky;top:0}
table.t td.l,table.t th.l{text-align:left}
.grp{border:1.5px solid var(--line);border-left:6px solid var(--zhu);border-radius:10px;padding:10px 14px;background:#fff}
.grp h4{margin:0 0 4px;font-size:17px;font-family:var(--serif)}
.grp .seatsline{font-size:15px;font-weight:700;color:var(--zhu)}
.grp .rem{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.55}

/* ---------- 路線 B：AI 生題 / 比較 ---------- */
.gen-form{width:520px;flex:0 0 520px;display:flex;flex-direction:column;gap:12px}
.gen-form>*{flex-shrink:0}
.gen-form textarea{height:150px;resize:none;font-size:15.5px;line-height:1.5}
.tr-opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 0 34px;font-size:15px}
.tr-o{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tr-o .ok{color:#245446;font-weight:700}
.tr-o .trace{flex-basis:100%;margin-left:22px;font-size:13.5px;color:var(--ink2,#444);line-height:1.5}
.tr-o .tr-ok{margin-left:22px}
.keynote{font-size:13.5px;color:var(--ink2);line-height:1.6;background:var(--paper2);border-radius:10px;padding:10px 12px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--zhu);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.cmp td{font-size:15.5px}
.cmp td.better{font-weight:900;color:#245446}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;z-index:80;font-size:17px}

/* ---------- v2：整卷作答 ---------- */
.pdots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pdot{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer;color:var(--ink2)}
.pdot.ok{background:var(--ink2);border-color:var(--ink2);color:#fff}
.pdot.warn{background:var(--huang-l);border-color:var(--huang);color:#6b4f10}
.conf.need button{border-color:var(--huang);background:var(--huang-l);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(185,138,30,.25)}}
.conf.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.save-msg{text-align:right;min-height:22px;font-size:15px;color:var(--ink3)}
.save-msg.need{color:#8a5a00;font-weight:700;font-size:18px}
.pdot.cur{outline:3px solid var(--zhu);outline-offset:2px}
.pair{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.25)}
.pair.on{border-style:solid;border-color:var(--ink3)}
.pair-h{display:flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.pair-h input{width:22px;height:22px;accent-color:var(--zhu)}
.settag{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;color:#fff;white-space:nowrap}
.settag.a{background:var(--dai)} .settag.b{background:var(--huang)}
.seg-sw{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg-sw button{font-family:var(--sans);font-weight:700;font-size:15px;padding:7px 16px;border:none;background:var(--card);cursor:pointer;color:var(--ink2)}
.seg-sw button.on{background:var(--ink);color:#fff} .seg-sw button:disabled{opacity:.35;cursor:not-allowed}
.suggest{max-width:760px;white-space:normal;line-height:1.45}
.irows{display:flex;flex-direction:column;gap:6px;min-height:0}
.irow{display:grid;grid-template-columns:30px minmax(0,1.1fr) 1fr 128px 70px;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;border:1.5px solid transparent}
.irow:hover{border-color:var(--line);background:#fff}
.ino{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--zhu);text-align:center}
.istem{font-family:var(--serif);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:flex;height:30px;border-radius:7px;overflow:hidden;background:var(--paper2)}
.sbar .seg{display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap;opacity:.85}
.sbar .seg.right{opacity:1;box-shadow:inset 0 0 0 3px var(--qing),inset 0 0 0 5px #fff}
.irate{font-family:var(--serif);font-weight:900;font-size:20px;text-align:right;white-space:nowrap}
.stuck-list{grid-column:1/3;background:#fff;font-weight:500;max-height:92px;overflow:auto;font-size:14.5px;line-height:1.5}
.imis{font-size:13px;font-weight:700;white-space:nowrap}
.seat{flex-direction:column;line-height:1.05;overflow:hidden}
.seat small{font-size:10.5px;font-weight:700;opacity:.9}
.seat i{position:absolute;left:0;bottom:0;height:4px;background:var(--qing);transition:width .3s}
.seat.ok i,.seat.no i,.seat.mid i{display:none}
.seat.mid{background:var(--huang);border-color:var(--huang);color:#fff}
.mis-ghost{position:absolute;top:-3px;bottom:-3px;border-right:3px dashed var(--ink);transition:left .4s}
.live-grid .veil{inset:44px 10px 10px}
.stale{display:flex;align-items:center;gap:14px;font-weight:700;font-size:16px;padding:10px 16px;border-radius:12px;background:var(--zhu-l);border:2px solid var(--zhu);color:#7d2a1c}

/* ============ 備課網頁風格（與三版本教科書比較網頁一致） ============ */
:root{
  --paper:#f3f8fb; --paper2:#edf3f8; --card:#fff; --ink:#18324a; --ink2:#4f6679; --ink3:#8aa0b2; --line:#e2ecf3;
  --zhu:#e2574c; --zhu-l:#fdecea;            /* 錯誤、迷思：紅 */
  --qing:#12a37f; --qing-l:#e3f6ef;          /* 正確：綠（南一綠） */
  --huang:#e0901c; --huang-l:#fff3df;        /* 提醒：橘（翰林橘） */
  --dai:#2f7fd8; --dai-l:#e8f2fd;            /* 主要：藍（康軒藍） */
  --vio:#7a6ad8; --vio-l:#efecfc;            /* 強調：紫 */
  --oA:#2f7fd8; --oB:#12a37f; --oC:#e0901c; --oD:#7a6ad8; --oE:#4f6679;
  --serif:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sh:0 6px 18px rgba(24,50,74,.06); --sh2:0 2px 8px rgba(24,50,74,.07);
}
html,body{background:#e6eef5}
#stage{background:radial-gradient(1200px 600px at 85% -10%,#dff1ff 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#e0f7ee 0,transparent 55%),var(--paper);box-shadow:0 10px 40px rgba(24,50,74,.15)}
h1,h2,h3{font-weight:800;letter-spacing:.01em}
header.top{background:rgba(243,248,251,.94);border-bottom:2px solid var(--line)}
.brand{font-weight:800;letter-spacing:.5px}
.brand .seal{background:var(--vio);border-radius:10px}
.route-tag{border:2px solid var(--vio);color:var(--vio);background:var(--card)}
.chip{background:var(--card);border:2px solid var(--line);color:var(--ink2);box-shadow:none}
footer.by{font-family:var(--sans)}
/* 按鈕：膠囊、柔和陰影 */
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;box-shadow:var(--sh2);font-weight:700}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(24,50,74,.10);border-color:var(--ink3)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{box-shadow:none;transform:none}
.btn.zhu{background:var(--zhu);border-color:var(--zhu);color:#fff;box-shadow:0 4px 12px rgba(226,87,76,.25)}
.btn.qing{background:var(--qing);border-color:var(--qing);color:#fff;box-shadow:0 4px 12px rgba(18,163,127,.25)}
.btn.dai{background:var(--dai);border-color:var(--dai);color:#fff;box-shadow:0 4px 12px rgba(47,127,216,.25)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{box-shadow:var(--sh2);border-radius:999px}
.btn.big{border-radius:999px}
/* 卡片：白底、圓角 20、上緣色條 */
.card,.panel{background:var(--card);border:none;border-radius:20px;box-shadow:var(--sh)}
.panel{border-top:6px solid var(--dai)}
.live-grid .panel:nth-child(2){border-top-color:var(--qing)} .live-grid .panel:nth-child(3){border-top-color:var(--zhu)}
.home-card{border:none;border-top:8px solid var(--dai);border-radius:22px;box-shadow:var(--sh)}
.home-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(24,50,74,.12)}
#go-tea{border-top-color:var(--vio)}
.home-card b{font-weight:800}
#v-home h1{font-weight:900;letter-spacing:4px}
#v-home .sub{font-family:var(--sans)}
/* 分頁：膠囊；選取＝深藍實心 */
.tabs{border-bottom:2px solid var(--line);gap:10px;padding-bottom:8px}
.tab{border:2px solid var(--vio-l);border-radius:999px;margin-bottom:0;background:var(--card);color:var(--ink2);font-weight:700;box-shadow:var(--sh2);font-size:17px;padding:8px 20px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg-sw{border:2px solid var(--line);border-radius:999px}
.seg-sw button{font-weight:700}
.seg-sw button.on{background:var(--ink)}
/* 題庫 */
.bank-li{border:2px solid var(--line);border-radius:16px;background:var(--card)}
.bank-li.on{border-color:var(--vio);box-shadow:0 0 0 3px var(--vio-l)}
.bank-li b{font-weight:800}
.rtag.A{background:var(--dai)} .rtag.B{background:var(--huang)}
.pair{border:2px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.5)}
.pair.on{border:2px solid var(--vio-l);background:#fff;box-shadow:var(--sh)}
.pair-h input,.item-h input[type=checkbox]{accent-color:var(--vio)}
.item{border:1.5px solid var(--line);border-radius:14px;background:#fbfdff}
.settag.a{background:var(--dai)} .settag.b{background:var(--huang)}
.mis-code{color:var(--zhu);border-color:var(--zhu);background:#fff;border-radius:999px;padding:0 7px}
input[type=text],input[type=number],input[type=password],textarea,select{border:2px solid var(--line);border-radius:12px;background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--vio)}
.keynote{background:var(--vio-l)}
/* 學生作答 */
.stem{font-weight:800}
.opt{border:2px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--sh2)}
.opt:hover{border-color:var(--ink3)}
.opt .k{border-radius:12px}
.opt.sel{border-color:var(--vio);box-shadow:0 0 0 4px var(--vio-l);background:#fff}
.opt.right{border-color:var(--qing);background:var(--qing-l)}
.opt.wrong{border-color:var(--zhu);background:var(--zhu-l)}
.conf button{border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink2)}
.conf button.sel{background:var(--vio);border-color:var(--vio);color:#fff}
.conf.need button{border-color:var(--huang);background:var(--huang-l);color:#9a5d00}
.pdot{border-radius:999px;border:2px solid var(--line);background:var(--card)}
.pdot.ok{background:var(--ink);border-color:var(--ink)}
.pdot.warn{background:var(--huang-l);border-color:var(--huang);color:#9a5d00}
.pdot.cur{outline:3px solid var(--vio)}
.stu-head .qno{color:var(--vio);font-weight:800}
.round-banner{background:var(--huang-l);border:2px solid var(--huang);color:#8a5200;border-radius:16px}
.fb{border-radius:16px}
.stu-msg .big{font-weight:900}
/* 儀表板 */
.code-big{color:var(--vio);border:2px solid var(--vio);background:#fff;border-radius:14px;font-weight:900;font-family:var(--sans)}
.phase{border-radius:999px;background:var(--paper2);color:var(--ink2)}
.phase.open{background:var(--qing);color:#fff} .phase.locked{background:var(--huang);color:#fff} .phase.reveal{background:var(--dai);color:#fff}
.suggest{background:var(--huang-l);border:2px solid #f6d7a3;color:#8a5200;border-radius:14px}
.irow{border-radius:12px} .irow:hover{background:#f5faff;border-color:var(--line)}
.ino{color:var(--vio)}
.sbar{border-radius:999px;background:var(--paper2)}
.sbar .seg{opacity:.9}
.bar-track{background:var(--paper2);border-radius:12px} .bar-fill{border-radius:12px}
.bar-row .k{border-radius:10px}
.mis-track{background:var(--paper2);border-radius:999px} .mis-fill{background:#f08a80} .mis-fill.sure{background:var(--zhu)}
.quad div{border-radius:14px;border:2px solid var(--line)}
.quad .q-ok{background:var(--qing-l);border-color:#bfe8d9} .quad .q-luck{background:#f2faf6} .quad .q-learn{background:#fff8ee} .quad .q-stuck{background:var(--zhu-l);border-color:#f6c4be;color:#b23a30}
.seat{border-radius:10px;border:2px dashed var(--line)}
.seat.in{border:2px solid var(--line);background:#fff;color:var(--ink2)}
.seat.ans{background:var(--ink2);border-color:var(--ink2)}
.seat.ok{background:var(--qing);border-color:var(--qing)} .seat.mid{background:var(--huang);border-color:var(--huang)} .seat.no{background:var(--zhu);border-color:var(--zhu)}
.seat.sure::after{border:3px solid #8f2a22;border-radius:13px}
.seat i{background:var(--vio)}
.veil{background:repeating-linear-gradient(135deg,var(--paper2) 0 14px,#fff 14px 28px);border-radius:14px}
.stale{background:var(--zhu-l);border:2px solid #f6c4be;color:#b23a30;border-radius:14px}
.qr-box{border:none;border-radius:24px;box-shadow:0 20px 50px rgba(24,50,74,.25)}
.qr-box .c{color:var(--vio);font-family:var(--sans);font-weight:900}
.qr-modal{background:rgba(24,50,74,.45)}
/* 摘要 */
.stat{background:var(--card);border:none;border-radius:18px;box-shadow:var(--sh);border-top:5px solid var(--dai)}
.stat-row .stat:nth-child(3){border-top-color:var(--qing)} .stat-row .stat:nth-child(4){border-top-color:var(--huang)} .stat-row .stat:nth-child(5){border-top-color:var(--zhu)}
.stat b{font-weight:900}
.grp{border:none;border-left:6px solid var(--zhu);border-radius:14px;background:#fff;box-shadow:var(--sh2)}
table.t th{background:#f5f9fc;color:var(--ink2)}
table.t th,table.t td{border-bottom:1px solid var(--line)}
.err{border-radius:12px}
.toast{background:var(--ink);border-radius:999px}
.badge.bl{background:var(--dai-l);color:var(--dai);border-color:#c9def6}
.math{font-family:var(--sans);font-weight:600;letter-spacing:.3px}
.mis-code{border-radius:7px}
.create-box input{width:100%;min-width:0}
.create-box .row>label{min-width:0}
</style>
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="brand"><span class="seal">評</span>課堂形成性評量 <span class="route-tag" id="route-tag"></span></div>
    <div class="sp"></div>
    <span class="chip" id="mode-chip"><span class="dot" id="mode-dot"></span><span id="mode-txt">未連線</span></span>
    <button class="btn sm ghost" id="btn-home" hidden>⌂ 首頁</button>
  </header>
  <main>
    <!-- 首頁 -->
    <section class="view" id="v-home">
      <h1>課堂形成性評量</h1>
      <div class="sub" id="home-sub"></div>
      <div class="home-choice">
        <div class="home-card" id="go-stu"><div class="ic">✍️</div><b>學生作答</b><span>輸入課堂代碼與座號</span></div>
        <div class="home-card" id="go-tea"><div class="ic">📊</div><b>教師控台</b><span>題庫・開題・迷思儀表板</span></div>
      </div>
      <div class="home-note" id="home-note"></div>
    </section>

    <!-- 學生：加入 -->
    <section class="view" id="v-join" hidden>
      <div class="join-box card">
        <h2 style="font-size:32px;text-align:center">加入課堂</h2>
        <label class="fl">課堂代碼<input type="text" id="j-code" maxlength="8" autocomplete="off" placeholder="例如 K7Q2"></label>
        <label class="fl">座號<input type="number" id="j-seat" min="1" max="60" inputmode="numeric" placeholder="1"></label>
        <label class="row small muted" id="j-demo-wrap"><input type="checkbox" id="j-demo"> 示範模式（和教師控台開在同一台電腦測試用）</label>
        <div class="err" id="j-err" hidden></div>
        <button class="btn zhu big" id="j-go">進入課堂</button>
      </div>
    </section>

    <!-- 學生：作答 -->
    <section class="view" id="v-stu" hidden></section>

    <!-- 教師：登入 -->
    <section class="view" id="v-tlogin" hidden style="align-items:center;justify-content:center">
      <div class="card col" style="width:640px;gap:18px;padding:30px">
        <h2 style="font-size:30px">教師登入</h2>
        <p class="muted" style="margin:0;line-height:1.7">雲端模式：用教師 Google 帳號登入，學生用平板即時作答。<br>示範模式：不連網路，在這台電腦開另一個分頁當學生，或用「模擬全班」看儀表板效果。</p>
        <button class="btn dai big" id="t-google">以 Google 帳號登入（雲端）</button>
        <button class="btn big" id="t-demo">進入示範模式（本機）</button>
        <div class="err" id="t-err" hidden></div>
      </div>
    </section>

    <!-- 教師：題庫與建立場次 -->
    <section class="view" id="v-tbank" hidden>
      <div class="tabs" id="t-tabs"></div>
      <div class="tpane" id="tp-bank">
        <div class="bank-side">
          <div class="row" style="justify-content:space-between"><h3 style="font-size:20px">題庫</h3>
            <div class="row" style="gap:8px"><button class="btn sm" id="b-import">匯入 JSON</button><button class="btn sm" id="b-export">匯出</button></div></div>
          <input type="file" id="b-file" accept=".json,application/json" hidden>
          <div class="bank-list scroll" id="bank-list" style="max-height:330px"></div>
          <div class="card create-box">
            <h3 style="font-size:19px">建立場次</h3>
            <div class="row"><label class="fl" style="flex:1">班級<input type="text" id="c-label" value="701"></label>
              <label class="fl" style="width:110px">人數<input type="number" id="c-size" value="28" min="1" max="60"></label></div>
            <div class="small muted" id="c-picked"></div>
            <button class="btn zhu" id="c-go">建立場次並產生代碼</button>
            <button class="btn sm ghost" id="c-resume" hidden>回到進行中的場次</button>
          </div>
        </div>
        <div class="col" style="flex:1;min-height:0">
          <div class="row" style="justify-content:space-between">
            <div><h3 style="font-size:22px" id="bank-title"></h3><div class="small muted" id="bank-meta"></div></div>
            <div class="row" style="gap:8px"><button class="btn sm" id="b-selall">全選通過題</button><button class="btn sm ghost" id="b-selnone">全不選</button></div>
          </div>
          <div class="items scroll" id="item-list"></div>
        </div>
      </div>
      <div class="tpane" id="tp-gen" hidden></div>
      <div class="tpane" id="tp-cmp" hidden></div>
      <div class="tpane" id="tp-howto" hidden></div>
    </section>

    <!-- 教師：即時儀表板 -->
    <section class="view" id="v-live" hidden>
      <div class="live-bar">
        <span class="code-big" id="l-code" title="點一下放大 QR Code"></span>
        <span class="chip" id="l-class"></span>
        <span class="phase" id="l-phase"></span>
        <span class="chip" id="l-count"></span>
        <span class="chip" id="l-timer">⏱ —</span>
        <div class="sp" style="flex:1"></div>
        <div class="seg-sw"><button id="l-v1" class="on">第一場</button><button id="l-v2">第二場</button></div>
      </div>
      <div class="live-bar">
        <button class="btn qing" id="l-start1">▶ 開始第一場</button>
        <button class="btn zhu" id="l-end1" hidden>⏹ 結束第一場・進入討論</button>
        <button class="btn qing" id="l-start2" hidden>▶ 開始第二場（平行題）</button>
        <button class="btn zhu" id="l-end2" hidden>⏹ 結束第二場</button>
        <button class="btn dai" id="l-results" hidden>📣 公布結果給學生</button>
        <div class="suggest" id="l-suggest"></div>
        <div class="sp" style="flex:1"></div>
        <button class="btn sm" id="l-sim" hidden>🤖 模擬全班作答</button>
        <button class="btn sm ghost" id="l-veil">🙈 投影保護：關</button>
        <button class="btn sm" id="l-sum">出場摘要</button>
        <button class="btn sm ghost" id="l-back">題庫</button>
      </div>
      <div class="stale" id="l-stale" hidden></div>
      <div class="live-grid" id="l-main"></div>
      <div class="qr-modal" id="qr-modal" hidden>
        <div class="qr-box"><div id="qr"></div><div class="col" style="gap:14px"><div class="muted" style="font-size:22px">課堂代碼</div><div class="c" id="qr-code"></div>
          <div class="small muted" id="qr-url" style="max-width:520px;word-break:break-all"></div><button class="btn" id="qr-close">關閉</button></div></div>
      </div>
    </section>

    <!-- 出場摘要 -->
    <section class="view" id="v-sum" hidden></section>
    <div class="toast" id="toast" hidden></div>
  </main>
  <footer class="by">蘇恭弘。數學王子。台南市忠孝國中製作　<span id="app-ver"></span></footer>
</div>

<script>
/* ============================================================
   形成性檢核：題庫自動驗算器（路線 A、B 共用）
   - 解析題目選項裡的算式（2^3×3^2×5、{2, 3, 5}、72）
   - 依 check.type 重算正解，並判讀每個誘答選項「錯在哪」
   ============================================================ */
(function (G) {
  'use strict';

  // ---------- 數論小工具 ----------
  function isPrime(n) {
    if (!Number.isInteger(n) || n < 2) return false;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) return false;
    return true;
  }
  function factorize(n) {                 // → [[p, e], ...] 由小到大
    const out = []; let m = n;
    for (let p = 2; p * p <= m; p++) {
      let e = 0; while (m % p === 0) { m /= p; e++; }
      if (e) out.push([p, e]);
    }
    if (m > 1) out.push([m, 1]);
    return out;
  }
  const distinctPrimes = n => factorize(n).length;
  const primeFactorCount = n => factorize(n).reduce((s, [, e]) => s + e, 0);
  const divisorCount = n => factorize(n).reduce((s, [, e]) => s * (e + 1), 1);
  const FN = { distinctPrimes, primeFactorCount, divisorCount };

  // ---------- 算式解析 ----------
  // 統一符號：× x X * · ⋅ → *；÷ 保留（整數/整數 是分數，÷ 是除號）；上標數字 → ^n；全形數字 → 半形；− – － → -；｜ → |
  const SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function norm(s) {
    s = String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48));
    s = s.replace(/[⁻]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + m.split('').map(c => SUP[c]).join(''));
    return s.replace(/[×xX*·⋅]/g, '*').replace(/（/g, '(').replace(/）/g, ')')
            .replace(/[－−–]/g, '-').replace(/＋/g, '+').replace(/｜/g, '|').replace(/．/g, '.').replace(/\s+/g, '');
  }

  // ---------- 精確有理數（分子分母用 BigInt，不用浮點數比對） ----------
  // {n, d}：d>0 且已約分；除以 0 得到 {n:0n, d:0n, u:true}（無法計算），之後的運算都維持無法計算
  const bgcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
  const UNDEF = Object.freeze({ n: 0n, d: 0n, u: true });
  function Q(n, d = 1n) {
    n = BigInt(n); d = BigInt(d);
    if (d === 0n) return UNDEF;

  // 四則＋次方＋絕對值＋帶分數（安全解析，不用 eval；全程精確分數）

  const fmtSet = a => a.length ? a.join('、') : '沒有這樣的數';
  // 分數的寫法（不是算式）：整數、a/b、整數又a/b，可帶負號 → {q, kind, reduced, whole, num, den}

    powToMul: { name: '次方當成乘法', ex: '2^3 → 2×3', f: n => n.t === 'bin' && n.op === '^' ? { ...n, op: '*' } : n },
    mulToAdd: { name: '乘法做成加法', ex: '8×9 → 8＋9', f: n => n.t === 'bin' && n.op === '*' ? { ...n, op: '+' } : n },

    subToAdd: { name: '減法做成加法', ex: '5−8 → 5＋8', f: n => n.t === 'bin' && n.op === '-' ? { ...n, op: '+' } : n },
    swapSub: { name: '減法前後對調（以為減法可以交換）', ex: '7−10 → 10−7', f: n => n.t === 'bin' && n.op === '-' ? { ...n, a: n.b, b: n.a } : n },

    negIntoPow: { name: '負號也被次方（−a^n 當成 (−a)^n）', ex: '−3^2 → (−3)^2', f: n => n.t === 'neg' && unP(n.a).t === 'bin' && unP(n.a).op === '^' && n.a.t !== 'paren' ? { t: 'bin', op: '^', a: { t: 'paren', a: { t: 'neg', a: n.a.a } }, b: n.a.b } : n },
    negOutOfPow: { name: '(−a)^n 當成 −a^n（負號放到次方外）', ex: '(−2)^4 → −2^4', f: n => n.t === 'bin' && n.op === '^' && unP(n.a).t === 'neg' ? { t: 'neg', a: { t: 'bin', op: '^', a: unP(n.a).a, b: n.b } } : n },
    negFirstOnly: { name: '括號前的減號只作用在第一項', ex: '10−(3−5) → 10−3−5', f: n => {
      if (n.t === 'bin' && n.op === '-' && n.b.t === 'paren' && unP(n.b).t === 'bin' && ['+', '-'].includes(unP(n.b).op)) { const g = unP(n.b); return { t: 'bin', op: g.op, a: { t: 'bin', op: '-', a: n.a, b: g.a }, b: g.b }; }

    dropParens: { name: '忽略括號，照寫的順序算', ex: '2×(3＋4) → 2×3＋4', whole: true },

    numOnly: { name: '分數的次方只算分子', ex: '(2/3)^4 → 2^4/3', f: n => n.t === 'bin' && n.op === '^' && isFrac(n.a) ? { t: 'bin', op: '/', a: { t: 'bin', op: '^', a: unP(n.a).a, b: n.b }, b: unP(n.a).b } : n },

    fracAddEach: { name: '分數相加：分子加分子、分母加分母', ex: '1/2＋1/3 → 2/5', f: n => n.t === 'bin' && ['+', '-'].includes(n.op) && isFrac(n.a) && isFrac(n.b) ? { t: 'bin', op: '/', a: { t: 'paren', a: { t: 'bin', op: n.op, a: unP(n.a).a, b: unP(n.b).a } }, b: { t: 'paren', a: { t: 'bin', op: n.op, a: unP(n.a).b, b: unP(n.b).b } } } : n }

  // 驗證：規則套在例子上，要算出老師寫的錯誤答案，而且和正確答案不同
  function myCheck(spec) {
    const ids = spec.transforms || [];
    if (!Array.isArray(ids) || !ids.length || ids.length > 3) return { ok: false, msg: '變形要 1～3 個' };
    const bad = ids.filter(x => !TRANSFORMS[x]); if (bad.length) return { ok: false, msg: '不在白名單的變形：' + bad.join('、') };

    try { want = myEval(myParse(spec.wrong)); } catch (e) { return { ok: false, msg: '例子的錯誤答案：' + e.message }; }

    if (eq(got, right)) return { ok: false, got: qStr(got), right: qStr(right), trace, msg: `這樣算出來 ${qStr(got)} 剛好等於正確答案，不是迷思` };
    if (!eq(got, want)) return { ok: false, got: qStr(got), right: qStr(right), trace, msg: `這樣算出來是 ${qStr(got)}，不是你的例子的 ${qStr(want)}` };

  function myRuleOn(spec, expr) {

    pfIsFactor: { key: numKey }, pfIsPrime: { key: numKey },
    asAdd: { key: numKey }, asSub: { key: numKey }, asParen: { key: numKey }, asAbs: { key: numKey }, asDist: { key: numKey }, asRange: { key: numKey },
    exPow: { key: numKey }, ex01: { key: numKey }, exNeg10: { key: numKey }, exCmp: { key: numKey },
    exSci: { key: t => 'T:' + String(t).replace(/\s+/g, '') },                          // 值相同、寫法不同（235×10^4）也算不同選項

  // ---------- 單一規則執行 ----------
  function runRule(kind, id, P) {
    const rule = R[kind] && R[kind][id]; if (!rule) throw new Error(`題型 ${kind} 沒有規則 ${id}`);

  // 抽一組參數（符合 when），算出 let
  function sampleParams(tpl, r, fixed) {
    const P = {};

  function buildItem(tpl, ev, chosen, set, pair, ansPos, r) {

  // ---------- 出題器：多個模板 → fa-bank/1 ----------
  // spec：{ unit:{grade,code,name}, tpls:[模板], mis:[迷思表], count:組數, seed, rules:[老師勾的規則 id 或迷思代碼], title, id }
  function genBank(spec) {

    const misAll = (spec.mis || []).concat(GENERIC.filter(g => !(spec.mis || []).some(m => m.code === g.code)),
      custom.map(c => ({ code: c.code, name: c.name, desc: c.desc || '', example: `${c.expr}＝${c.wrong}`, remedy: c.fix || '', source: '老師自訂（我的迷思）：' + (c.desc || c.name), transforms: c.transforms })));

      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-firestore.js`)]);
    this.A = A; this.F = F;
    this.app = initializeApp(FIREBASE_CONFIG); this.auth = A.getAuth(this.app); this.db = F.getFirestore(this.app);
    this.ready = true;
  }
  get uid() { return this.auth && this.auth.currentUser ? this.auth.currentUser.uid : null; }

    await this.init(); const A = this.A;
    await this.auth.authStateReady?.();
    let u = this.auth.currentUser;
    if ((!u || u.isAnonymous) && interactive) {
      try { u = (await A.signInWithPopup(this.auth, new A.GoogleAuthProvider())).user; }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) { await A.signInWithRedirect(this.auth, new A.GoogleAuthProvider()); return null; }
        throw e;
      }
    }
    if (!u || u.isAnonymous) return null;
    if (!TEACHER_EMAILS.map(x => x.toLowerCase()).includes((u.email || '').toLowerCase())) { await A.signOut(this.auth); throw new Error(`${u.email} 沒有教師權限（教師名單在程式開頭 TEACHER_EMAILS 與 firestore.rules）。`); }

  }

  async listActive() { const F = this.F; const snap = await F.getDocs(F.query(F.collection(this.db, COL), F.where('active', '==', true))); return snap.docs.map(d => d.data()); }
  watchSession(code, cb) { return this.F.onSnapshot(this.sref(code), s => cb(s.exists() ? s.data() : null), e => console.error(e)); }
  async updateSession(code, patch) { await this.F.updateDoc(this.sref(code), patch); }
  watchResponses(code, cb) { const F = this.F; return F.onSnapshot(F.collection(this.db, COL, code, 'responses'), s => cb(s.docs.map(d => d.data())), e => console.error(e)); }
  watchStudents(code, cb) { const F = this.F; return F.onSnapshot(F.collection(this.db, COL, code, 'students'), s => cb(s.docs.map(d => d.data())), e => console.error(e)); }
  async getSession(code) { await this.init(); const s = await this.F.getDoc(this.sref(code)); return s.exists() ? s.data() : null; }
  async join(code, seat) {
    await this.init(); const F = this.F, A = this.A;

  }
  async submit(code, r) { const F = this.F; await F.setDoc(F.doc(this.db, COL, code, 'responses', `${r.seat}_${r.itemId}_r${r.round}`), { ...r, uid: this.uid, at: F.serverTimestamp() }); }

  async getStudent(code, seat) { const F = this.F; try { const s = await F.getDoc(F.doc(this.db, COL, code, 'students', String(seat))); return s.exists() ? s.data() : null; } catch (e) { return null; } }

      const snap = await F.getDocs(F.collection(this.db, COL, code, sub));

    }
    await F.deleteDoc(this.sref(code));
  }
}

check（驗算設定）只能用下列其中一種，系統會用程式重算正解，算不出唯一正解的題目會被擋下：
- {"type":"factorize","n":72}：選出 n 的標準分解式（只有一個選項是標準分解式）

- {"type":"isFactor","of":"2^3×3^2×5","want":true}：選項是數或乘積式，只有一個是（want:false 時只有一個不是）因數
- {"type":"isPrime","want":true}：選項是整數，只有一個是質數
- {"type":"value","fn":"firstNonzeroPlace|intDigits","x":"4.2×10^-5"}：x 的值在小數點後第幾位才出現第一個不是 0 的數字／x 的整數部分是幾位數（選項寫 5 或「第 5 位」「7 位數」）
- {"type":"extreme","want":"max|min"}：選項是數或算式，只有一個最大（或最小）
- {"type":"range","gt":-3,"lt":-2}：選項是數或算式，只有一個落在範圍內；gt＞、gte≥、lt＜、lte≤，可只給一邊，端點不算在 gt/lt 內
- {"type":"trueStmt","want":true}：選項是關係式（用 > < = ≥ ≤ ≠，如「|−4| = 4」），只有一個成立（want:false 時只有一個不成立）
- {"type":"sameValue","expr":"7−10"}：選項是算式，只有一個和 expr 的值相同
- {"type":"count","cond":"|x|<3","range":[-100,100]}：選項是數，等於滿足條件的整數 x 有幾個（條件只用變數 x）
- {"type":"solveSet","cond":"|x|=6","range":[-100,100]}：選項寫成「6、−6」或「沒有這樣的數」，只有一個等於所有整數解
- {"type":"undefinedOne"}：選項是算式，只有一個無法計算（除以 0）
- {"type":"pairRel","rel":"opposite|reciprocal|coprime"}：選項寫成「−6 與 6」，只有一組互為相反數（或互為倒數、或互質；coprime 只用正整數）

- {"type":"fraction","expr":"3/4+1/6","form":"simplest|mixed|improper"}：選項是分數的寫法（3/4、−3/4、帶分數一律寫「1又2/3」、整數），只有一個「值相等而且是最簡」；沒約分的判錯。form:mixed 要寫成帶分數、improper 要寫成假分數。算倒數用 expr "1÷(1又3/5)"（可加 "of":"1又3/5" 判讀「只把分數部分對調」）；expr 除以 0 時正解選項寫「沒有倒數」

- {"type":"sci","value":2350000}：選項寫成 a×10^n，只有一個值正確且 1 ≤ a < 10（value 也可以是字串算式，如 "0.00042"）
- {"type":"manual"}：無法用以上方式驗算的概念題（盡量少用）
算式寫法：次方用 ^（2^3、10^-3），乘號用 ×，除號用 ÷，分數用 3/4（整數/整數 視為一個分數，所以 5÷4/5＝5÷(4/5)；負底數或分數底數一定加括號：(−2)^3、(2/3)^2，寫 2/3^2 會被擋下），帶分數寫「1又2/3」（−1又2/3＝−(1＋2/3)），絕對值用 |−4|，負號用 −（−3^2＝−9，(−3)^2＝9）。驗算器全程用精確分數計算。不要用 LaTeX。`;

function bankStats(b) {
  const vb = V.verifyBank(b); const items = b.items || []; const mis = b.misconceptions || [];
  const wrongOpts = items.flatMap(it => it.options.filter(o => o.key !== it.answer));
  const used = new Set(wrongOpts.map(o => o.mis).filter(Boolean));
  const bloom = {}; items.forEach(it => bloom[it.bloom || '未標'] = (bloom[it.bloom || '未標'] || 0) + 1);
  const types = {}; items.forEach(it => { const t = (it.check && it.check.type) || 'manual'; types[t] = (types[t] || 0) + 1; });
  const diagHit = wrongOpts.length ? wrongOpts.filter(o => o.mis).length / wrongOpts.length : 0;
  // 同一題的誘答是否對應到不同迷思（診斷力）
  const distinct = items.length ? items.reduce((t, it) => { const ms = it.options.filter(o => o.key !== it.answer).map(o => o.mis).filter(Boolean); return t + (ms.length ? new Set(ms).size / ms.length : 0); }, 0) / items.length : 0;
  return {
    items: items.length, mis: mis.length, used: used.size, unusedList: mis.filter(m => !used.has(m.code)).map(m => m.code),
    pass: vb.summary.pass, fail: vb.summary.fail, manual: vb.summary.manual,
    diagHit, distinct, remedy: mis.filter(m => m.remedy).length, src: mis.filter(m => m.source && !/gemini|AI/i.test(m.source)).length,
    feedback: wrongOpts.filter(o => o.feedback).length, wrong: wrongOpts.length, bloom, types, pairs: vb.summary.pairs, pairOk: vb.summary.pairOk,
    avgOpt: items.length ? items.reduce((t, it) => t + it.options.length, 0) / items.length : 0
  };
}

  $('tp-cmp').innerHTML = `<div class="col" style="flex:1;min-height:0">

    <div class="row" style="gap:18px;align-items:flex-start;flex:1;min-height:0">
      <div class="card scroll" style="flex:1.1;max-height:100%"><table class="t cmp"><tr><th class="l">指標（程式可計算的部分）</th><th>路線 A</th><th>路線 B</th></tr>
        ${row('題數', a.items, b.items)}
        ${row('迷思數', a.mis, b.mis)}
        ${row('平行題組（結構一致）', a.pairOk, b.pairOk, `${a.pairOk}/${a.pairs}`, `${b.pairOk}/${b.pairs}`, hi(a.pairOk / (a.pairs || 1), b.pairOk / (b.pairs || 1)))}
        ${row('迷思有被誘答使用', a.used, b.used, `${a.used}/${a.mis}`, `${b.used}/${b.mis}`, hi(a.used / (a.mis || 1), b.used / (b.mis || 1)))}
        ${row('自動驗算通過', a.pass, b.pass, `${a.pass}/${a.items}`, `${b.pass}/${b.items}`, hi(a.pass / (a.items || 1), b.pass / (b.items || 1)))}
        ${row('驗算未通過', a.fail, b.fail, null, null, lo(a.fail, b.fail))}
        ${row('需人工確認', a.manual, b.manual, null, null, lo(a.manual, b.manual))}
        ${row('誘答選項有標迷思', a.diagHit, b.diagHit, pc(a.diagHit), pc(b.diagHit), hi(a.diagHit, b.diagHit))}
        ${row('同題誘答對應不同迷思', a.distinct, b.distinct, pc(a.distinct), pc(b.distinct), hi(a.distinct, b.distinct))}
        ${row('誘答有學生回饋', a.feedback, b.feedback, `${a.feedback}/${a.wrong}`, `${b.feedback}/${b.wrong}`)}
        ${row('迷思有補救建議', a.remedy, b.remedy, `${a.remedy}/${a.mis}`, `${b.remedy}/${b.mis}`)}
        ${row('迷思有教科書／文獻出處', a.src, b.src, `${a.src}/${a.mis}`, `${b.src}/${b.mis}`, hi(a.src / (a.mis || 1), b.src / (b.mis || 1)))}
        ${row('平均選項數', a.avgOpt, b.avgOpt, a.avgOpt.toFixed(1), b.avgOpt.toFixed(1))}
        ${row('Bloom 分布', 0, 0, dist(a.bloom), dist(b.bloom))}
        ${row('驗算題型', 0, 0, dist(a.types), dist(b.types))}
        ${B.genSeconds ? row('產生時間', 0, 0, '對話中產生', `${B.genSeconds} 秒${B.fixRounds ? `＋修正 ${B.fixRounds} 次` : ''}`) : ''}
      </table><p class="small muted" style="margin:8px 0 0">粗綠字＝這一項較好。這些只比「格式與驗算」；題目有沒有打中學生真正的迷思、用語是否合乎台灣教材，要老師看題判斷，上課後再用作答資料驗證。</p></div>
      <div class="card scroll" style="flex:1;max-height:100%"><h3 style="font-size:18px;margin-bottom:6px">迷思對照</h3>
        <table class="t small"><tr><th class="l">路線 A 迷思</th><th>題數</th><th class="l">路線 B 迷思</th><th>題數</th></tr>
        ${Array.from({ length: Math.max(A.misconceptions.length, B.misconceptions.length) }, (_, i) => {
          const ma = A.misconceptions[i], mb = B.misconceptions[i];
          const cnt = (bk, c) => c ? bk.items.filter(it => it.options.some(o => o.mis === c)).length : '';
          return `<tr><td class="l">${ma ? `<span class="mis-code">${esc(ma.code)}</span> ${esc(ma.name)}` : ''}</td><td>${ma ? cnt(A, ma.code) : ''}</td>
            <td class="l">${mb ? `<span class="mis-code">${esc(mb.code)}</span> ${esc(mb.name)}` : ''}</td><td>${mb ? cnt(B, mb.code) : ''}</td></tr>`;
        }).join('')}</table></div>
    </div></div>`;
  $('cmp-b').onchange = e => { T.cmpB = e.target.value; renderCmpPane(); };
}

// ============================================================
//  啟動
// ============================================================
(async function boot() {
  const role = params.get('role');
  const saved = ss.get('fa-stu');
  if (role === 'student' || params.get('code')) {
    if (saved && (!params.get('code') || saved.code === params.get('code').toUpperCase())) {
      try { store = saved.demo ? new LocalStore() : new FireStore(); await store.join(saved.code, saved.seat); startStudent(saved.code, saved.seat); return; }
      catch (e) { ss.del('fa-stu'); }
    }
    openJoin(); return;
  }
  if (role === 'teacher') { openTeacherLogin(); return; }
  show('v-home');
})();
window.__FA = { get L() { return L; }, get T() { return T; }, get S() { return S; }, Banks, V, stemNumsOk, callGemini, prepClassData };

</script>
