<!DOCTYPE html>
<html lang="zh-Hant">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自主練習・課堂形成性評量</title>
<style>

.p-top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}

.btn.on,.btn.pri{background:var(--dai);border-color:var(--dai);color:#fff}.btn.go{background:var(--qing);border-color:var(--qing);color:#fff}.btn.warn{background:var(--zhu);border-color:var(--zhu);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{color:var(--ink2);font-size:16px}
.muted{color:var(--ink3)}
h2{font-size:22px;margin:0 0 6px}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

.unit b{font-size:19px}.unit .u-n{display:block;font-size:15px;color:var(--ink3)}.unit .u-last{display:block;font-size:15px;color:var(--qing);font-weight:700}
.segs{display:flex;flex-direction:column;gap:8px}
.segs label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;min-height:48px}
.segs input{width:24px;height:24px;flex:none}
.p-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.p-head .qno{font-size:20px;font-weight:800}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:16px;cursor:pointer}
.dot.cur{border-color:var(--dai);box-shadow:0 0 0 2px var(--dai) inset}.dot.ok{background:var(--dai-l)}
.p-stem{font-size:22px;font-weight:700;white-space:pre-line;overflow-wrap:anywhere}
.p-fig{max-width:100%;overflow-x:auto}.p-fig svg{max-width:100%;height:auto;max-height:40vh}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.p-opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:20px;cursor:pointer;min-height:60px;overflow-wrap:anywhere}
.p-opt .k{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#fff;font-weight:800;font-size:18px}

.res .r-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

.pc-msgs{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.pc-m{max-width:85%;padding:10px 14px;border-radius:14px;font-size:19px;white-space:pre-line;overflow-wrap:anywhere}
.pc-m.ai{background:var(--card);border:1.5px solid var(--line);align-self:flex-start}.pc-m.me{background:var(--dai);color:#fff;align-self:flex-end}

      const o = { id: pair + it.set, pair, set: it.set, stem: it.stem, answer: it.answer, seg: it.seg || '', tpl: true,
        options: it.options.map(x => ({ key: x.key, text: x.text, mis: x.mis || null, feedback: x.feedback || '' })) };
      if (it.fig) o.fig = it.fig; return o; });
    return { items: its, mis: (b.misconceptions || []).map(m => ({ code: m.code, name: m.name })) };
  }
  const NMAX = 30;
  const seenOf = u => new Set((lsGet('fa-prac-seen', {}) || {})[u] || []);
  const orig = it => (cur && cur.from && cur.from[iid(it)]) || it.pair;   // 再練換成模板題時，記住它代替的是哪一組（算「已改善」用）
  // 同一個迷思的模板題：找誘答規則有這個迷思代碼的模板，出幾組，挑選項裡真的有這個迷思的那一題；沒有迷思代碼（用猜的）就找同概念的模板
  async function genForMis(u, code, seg) {
    const T0 = await loadTpl(u); if (!T0.tpl || !window.FARules) return null;
    const R0 = window.FARules.R, has = tp => (tp.distractors || []).some(id => R0[tp.kind] && R0[tp.kind][id] && R0[tp.kind][id].mis === code);
    let tpls = T0.tpl.tpls.filter(tp => !tp.optional && (code ? has(tp) : (!seg || tp.seg === seg)));
    if (!tpls.length && code) tpls = T0.tpl.tpls.filter(has);   // v3.71：只有進階（optional）模板有這個迷思時才用進階模板（例如七下1-3 SW17、SW19 只有康軒教）
    for (let k = 0; k < 4 && tpls.length; k++) {
      let g; try { g = makeGen(T0, tpls, Math.min(4, tpls.length * 2)); } catch (e) { continue; }
      const A = g.items.find(it => it.set === 'A' && (!code || it.options.some(o => o.mis === code)));
      if (A) return { items: g.items.filter(it => it.pair === A.pair).sort((x, y) => x.set < y.set ? -1 : 1), mis: g.mis };
    }
    return null;
  }

      // v3.60（老師：「照這兩項改」）：現成題先出這台裝置還沒做過的（fa-prac-seen）；每組只出一卷（另一卷留給平行題再練）；

      const cand = pool.filter(it => P.segs.includes(it.seg || '')), seen = seenOf(P.unit);
      const prs = shuffle([...new Set(cand.map(it => it.pair))]), pickOf = arr => iid(arr[Math.floor(Math.random() * arr.length)]);
      const fresh = prs.filter(pr => cand.some(it => it.pair === pr && !seen.has(iid(it)))).map(pr => pickOf(cand.filter(it => it.pair === pr && !seen.has(iid(it)))));

  function grade() {
    const list = cur.ids.map(byId).filter(Boolean);

      return { it, a, o, right, guess: right && a.conf === 'low', sure: !right && a.conf === 'high', mis: !right && o && o.mis ? misOf(o.mis) || { code: o.mis, name: o.mis } : null }; });
    const ok = rows.filter(r => r.right).length, N = rows.length;
    const again = rows.filter(r => !r.right || r.guess);
    const wrong = rows.filter(r => !r.right);

    return { rows, ok, N, again, wrong, kind };

${AI.code() && r.o && !r.it.tpl ? `<div><button class="btn p-ai ${(lsGet(chatKey(r), {}) || {}).done ? '' : 'pri'}" data-i="${i}">${(lsGet(chatKey(r), {}) || {}).done ? '✓ 已和 AI 訂正・再看對話' : '🤖 和 AI 一起想這題'}</button></div>` : ''}`}</div>`).join('')}`;
    document.querySelectorAll('.p-ai').forEach(b => b.onclick = () => openChat(R.rows[+b.dataset.i], +b.dataset.i));
    if ($('p-retry')) $('p-retry').onclick = async () => {
      const pairs = R.again.map(r => orig(r.it)); const mis = {}; R.again.forEach(r => mis[orig(r.it)] = r.mis ? r.mis.name : '');
      $('p-retry').disabled = true; $('p-retry').textContent = '出題中…';
      // v3.60：平行題（同組另一卷）這台裝置做過了 → 改出同一個迷思的模板題；找不到才用原來的平行題
      const seen = seenOf(cur.unit), gen = cur.gen ? { items: cur.gen.items.slice(), mis: cur.gen.mis.slice() } : { items: [], mis: [] }, from = {}, ids = [];
      for (const r of R.again) { const pt = partner(r.it); let id = iid(pt);
        if (!r.it.tpl && (seen.has(id) || pt === r.it)) { const g = await genForMis(cur.unit, r.mis ? r.mis.code : null, r.it.seg || '');
          if (g) { gen.items.push(...g.items); g.mis.forEach(m => { if (!gen.mis.some(x => x.code === m.code)) gen.mis.push(m); }); id = iid(g.items[0]); } }
        from[id] = orig(r.it); ids.push(id); }
      cur = { unit: cur.unit, try: cur.try + 1, ids, ans: {}, idx: 0, done: false, prev: { pairs, mis }, gen: gen.items.length ? gen : null, from }; save(); P.view = 'quiz'; render(); scrollTo(0, 0);
    };
    $('p-new').onclick = () => { cur = null; save(); P.view = 'setup'; render(); };
  }

  // ---------- v3.57 和 AI 一起想（蘇格拉底式提問；Worker 從線上題庫讀題目與正解） ----------
  function openChat(r, i) {
    const key = chatKey(r); let C = lsGet(key, null) || { msgs: [], stage: 1, done: false }; let busy = false, err = '', left = null, live = '', out = false;
    const ov = document.createElement('div'); ov.id = 'p-chat'; ov.className = 'p-chat'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); document.body.appendChild(ov);
    const close = () => { ov.remove(); document.removeEventListener('keydown', esc1); renderResult(); };
    const esc1 = e => { if (e.key === 'Escape' && !busy) close(); }; document.addEventListener('keydown', esc1);
    const draw = keep => {
      const typed = keep != null ? keep : ($('p-msg') ? $('p-msg').value : '');
      ov.innerHTML = `<div class="pc-bar"><b>第 ${i + 1} 題・和 AI 一起想</b><span class="pc-stg">${C.done ? '✓ 完成' : `第 ${C.stage} 步（共 4 步）：${STG_TXT[C.stage]}`}</span><span style="flex:1"></span><button class="btn" id="p-chat-x" aria-label="關閉">✕<span class="pc-xt"> 關閉</span></button></div>
        <div class="pc-body"><div class="card pc-q"><div class="p-stem" style="font-size:19px">${M(r.it.stem)}</div><div class="pc-ans">你選：<b class="no">${M(r.o.text)}</b>　正解：<b class="ok">${M((r.it.options.find(x => x.key === r.it.answer) || {}).text)}</b></div></div>
          <div class="pc-msgs" id="p-msgs">${C.msgs.map(m => `<div class="pc-m ${m.role === 'user' ? 'me' : 'ai'}">${M(m.text)}</div>`).join('')}${busy ? `<div class="pc-m ai">${live ? M(live) : '<span class="muted">AI 想一下…</span>'}</div>` : ''}
          ${err ? `<div class="pc-err" role="alert">${esc(err)}</div>` : ''}${C.done ? '<div class="pc-done">✓ 這題訂正完成！回到結果頁，可以用平行題再練一次，確認真的會了。<div style="margin-top:8px"><button class="btn go" id="p-chat-back">回結果頁</button></div></div>' : ''}
          ${out ? '<div class="pc-err" role="alert">今天和 AI 對話的次數用完了，明天再來。現在可以先回結果頁，用平行題再練一次。</div>' : ''}</div></div>
        ${C.done || out ? '' : `<div class="pc-in"><textarea id="p-msg" rows="2" placeholder="把你的想法打在這裡…" ${busy ? 'disabled' : ''}></textarea><button class="btn pri" id="p-send" ${busy ? 'disabled' : ''}>送出</button></div>`}
        ${left != null && !out ? `<div class="hint pc-left">今天還可以問 ${left} 次（每送出一次算一次，第一句也算）</div>` : ''}`;
      if ($('p-msg')) $('p-msg').value = typed; $('p-chat-x').onclick = () => { if (!busy) close(); }; if ($('p-chat-back')) $('p-chat-back').onclick = close;
      if ($('p-send')) $('p-send').onclick = () => { const t = $('p-msg').value.trim(); if (!t) { toast('先打字再送出'); return; } send(t); };
      const box = $('p-msgs'); box.scrollTop = box.scrollHeight;
    };
    async function send(text) {
      busy = true; err = ''; live = ''; C.msgs.push({ role: 'user', text }); lsSet(key, C); draw('');
      const back = msg => { C.msgs.pop(); lsSet(key, C); busy = false; err = msg; draw(text); };
      let res;
      try { res = await fetch(AI.sw(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'prac', code: AI.code(), dev: AI.dev(), unit: cur.unit, itemId: iid(r.it), choice: r.a.choice, stage: C.stage, history: C.msgs.map(m => ({ role: m.role, text: m.text })) }) }); }
      catch (e) { return back('連不上 AI，請檢查網路後再送出一次（你打的字還在）。'); }
      if (!res.ok) { let j = null; try { j = await res.json(); } catch (e) { } if (res.status === 429 && /用完/.test((j && j.error) || '')) { out = true; return back(''); } return back((j && j.error) || `AI 服務暫時有問題（${res.status}），請稍後再送出一次。`); }
      const rm = res.headers.get('X-Remaining'); if (rm) { left = +rm; if (left <= 0) out = true; }
      let all = '';
      try { const rd = res.body.getReader(), dec = new TextDecoder(); for (;;) { const { done, value } = await rd.read(); if (done) break; all += dec.decode(value, { stream: true }); live = all.replace(/^\s*階段：\S*\s*\n?/, ''); draw(''); } }
      catch (e) { all += '\n（連線中斷，請再送出一次。）'; }
      const m = all.match(/^\s*階段：(條件|關係|計算|驗算|完成)/); let body = all.replace(/^\s*階段：\S*\s*\n?/, '').trim() || '（AI 沒有回覆內容，請再送出一次。）';
      if (m) { if (m[1] === '完成') C.done = true; else C.stage = STG.indexOf(m[1]); }
      C.msgs.push({ role: 'tutor', text: body }); lsSet(key, C); busy = false; live = ''; draw('');
    }
    draw('');
    if (!C.msgs.length) send(`我選了「${r.o.text}」，想知道哪裡錯了。`);
  }

  async function render() {
    if (P.view === 'home') return renderHome();
    if (P.view === 'setup') return renderSetup();
    if (!cur) { P.view = 'home'; return renderHome(); }
    if (!P.bank || P.unit !== cur.unit) { $('p-main').innerHTML = '<div class="card">題庫下載中…</div>'; await loadBank(cur.unit); if (!P.bank) { P.view = 'setup'; return renderSetup(); } }
    if (P.view === 'quiz') return renderQuiz();
    return renderResult();
  }
  $('p-home').onclick = () => { if (P.view === 'quiz' && cur && Object.keys(cur.ans).length && !confirm('離開這一回？已作答的會清掉。')) return; if (P.view !== 'result') cur = null; else cur = null; save(); P.view = 'home'; P.grade = P.grade || (unitOf(P.unit) || {}).grade || null; render(); };
  // 測試用
  window.__PR = { cur: () => { if (!cur) return null; const it = byId(cur.ids[cur.idx]); return it ? { ...it, id: iid(it) } : null; }, state: () => cur, dev: () => AI.dev(), byId };
  if (cur && cur.unit) { P.unit = cur.unit; P.grade = (unitOf(cur.unit) || {}).grade || null; P.view = cur.done ? 'result' : 'quiz'; }
  render();
})();

</script>
</body>
</html>
